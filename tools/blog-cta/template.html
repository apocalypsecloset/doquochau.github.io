<!--@top-->
<aside class="ac-bcta ac-bcta--top" aria-label="{{shop_label}}">
  <a class="ac-bcta__thumbs" href="{{url_top}}" tabindex="-1" aria-hidden="true">
    <img src="{{a_img}}" alt="" width="1536" height="2048" loading="lazy" decoding="async">
    <img src="{{b_img}}" alt="" width="1536" height="2048" loading="lazy" decoding="async">
  </a>
  <div class="ac-bcta__copy">
    <p class="ac-bcta__line">{{top_line}}</p>
    <p class="ac-bcta__sub">{{top_sub}}</p>
  </div>
  <a class="ac-bcta__btn" href="{{url_top}}">{{top_link}}</a>
</aside>
<!--@/top-->

<!--@mid-->
<aside class="ac-bcta ac-bcta--mid" aria-label="{{shop_label}}">
  <a class="ac-bcta__media" href="{{url_mid}}" tabindex="-1" aria-hidden="true">
    <img src="{{p_img}}" alt="" width="1536" height="2048" loading="lazy" decoding="async">
  </a>
  <div class="ac-bcta__body">
    <p class="ac-bcta__kicker">{{mid_kicker}}</p>
    <p class="ac-bcta__title">{{p_name}}</p>
    <p class="ac-bcta__text">{{mid_text}}</p>
    <div class="ac-bcta__meta">
      <span class="ac-bcta__price">{{p_price}}</span>
      <a class="ac-bcta__btn" href="{{url_mid}}">{{mid_button}}</a>
    </div>
  </div>
</aside>
<!--@/mid-->

<!--@end-->
<section class="ac-bcta ac-bcta--end" aria-labelledby="ac-bcta-end-title">
  <div class="ac-bcta__head">
    <p class="ac-bcta__title" id="ac-bcta-end-title">{{end_title}}</p>
    <p class="ac-bcta__text">{{end_text}}</p>
  </div>
  <div class="ac-bcta__tiles">
    <a class="ac-bcta__tile" href="{{url_end_a}}">
      <span class="ac-bcta__tile-img"><img src="{{a_img}}" alt="{{a_alt}}" width="1536" height="2048" loading="lazy" decoding="async"></span>
      <span class="ac-bcta__tile-body"><span class="ac-bcta__tile-name">{{a_name}}</span><span class="ac-bcta__tile-price">{{a_price}}</span></span>
    </a>
    <a class="ac-bcta__tile" href="{{url_end_b}}">
      <span class="ac-bcta__tile-img"><img src="{{b_img}}" alt="{{b_alt}}" width="1536" height="2048" loading="lazy" decoding="async"></span>
      <span class="ac-bcta__tile-body"><span class="ac-bcta__tile-name">{{b_name}}</span><span class="ac-bcta__tile-price">{{b_price}}</span></span>
    </a>
  </div>
  <div class="ac-bcta__actions">
    <a class="ac-bcta__btn" href="{{url_end}}">{{end_button}}</a>
    <span class="ac-bcta__trust">{{trust}}</span>
  </div>
<!--@form-->
  <form class="ac-bcta__form" action="{{form_action}}" method="post">
    <label for="ac-bcta-email">{{form_label}}</label>
    <input id="ac-bcta-email" type="email" name="email" placeholder="{{form_placeholder}}" autocomplete="email" required>
    <button type="submit">{{form_button}}</button>
  </form>
<!--@/form-->
</section>
<!--@/end-->

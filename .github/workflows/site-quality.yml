name: Website quality
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  static-and-shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r scripts/requirements-en.txt
      - run: npm install --prefix /tmp/ac-shop-tests jsdom@31.0.0 --no-audit --no-fund
      - run: node --test scripts/test_shop.cjs
        env:
          NODE_PATH: /tmp/ac-shop-tests/node_modules
      - run: python scripts/qa_site.py
      - name: Full translated article and hub gates
        run: |
          python - <<'PY'
          import subprocess,sys
          from pathlib import Path
          for manifest in sorted(Path('data/en-translations').glob('batch*.json')):
              if manifest.stem == 'batch05b':
                  continue
              subprocess.run([sys.executable,'scripts/qa_en_translations.py',manifest.stem],check=True)
          PY
